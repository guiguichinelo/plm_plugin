<script>(()=>{const root=document.getElementById('plm-app');if(root.dataset.ready)return;root.dataset.ready='1';const start=()=>{if(!window.PLM?.interactionsReady||!PLM.surface||!PLM.libraryProvider||!window.ApiClient){setTimeout(start,50);return;}PLM.i18n.ready.then(()=>{PLM.i18n.apply(root);const script=document.createElement('script');script.src=ApiClient.getUrl('PLM/web/library.js')+'?v='+PLM.version;script.onerror=()=>{root.querySelector('#plm-status').textContent=PLM.t('PlmPageLoadError');};document.head.append(script);});};start();})();</script>
